name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package standalone application
        run: |
          mkdir -p release-package/.next
          cp -R .next/standalone/. release-package/
          cp -R .next/static release-package/.next/static
          cp -R public release-package/public
          tar -czf "monacoblackcar-${GITHUB_REF_NAME}.tar.gz" -C release-package .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "monacoblackcar-${GITHUB_REF_NAME}.tar.gz" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag